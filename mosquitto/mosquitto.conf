# =============================================================================
# Eclipse Mosquitto — Broker MQTT
# =============================================================================

# Écoute sur le port MQTT standard
listener 1883
protocol mqtt

# Écoute WebSocket (optionnel, utile pour debug)
listener 9001
protocol websockets

# Autoriser les connexions anonymes (environnement de dev)
# En production : mettre false et configurer l'authentification
allow_anonymous true

# Persistence des messages
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type all
