# =============================================================================
# Telegraf — Bridge MQTT → Prometheus
# Lit les messages MQTT des capteurs IoT et les expose au format Prometheus
# =============================================================================

[global_tags]

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "telegraf"
  omit_hostname = false

# =============================================================================
# ENTRÉE : Consommation des messages MQTT
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]

  # S'abonner à tous les capteurs
  topics = [
    "sensors/+/telemetry"
  ]

  # Format des messages : JSON
  data_format = "json"

  # Champs JSON à utiliser comme tags (dimensions)
  tag_keys = ["device_id", "location", "type"]

  # Champ JSON contenant la valeur numérique
  json_string_fields = []

  # Nom de la mesure dans Prometheus
  name_override = "mqtt_consumer"

  # QoS MQTT (0 = au plus une fois)
  qos = 0

# =============================================================================
# SORTIE : Exposition au format Prometheus (scrappée par Prometheus)
# =============================================================================

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "120s"
  path = "/metrics"
  string_as_label = true
