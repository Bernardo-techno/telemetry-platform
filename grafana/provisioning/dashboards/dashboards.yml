# Chargement automatique des dashboards au démarrage
apiVersion: 1

providers:
  - name: 'Telemetry Dashboards'
    orgId: 1
    folder: 'Télémétrie'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
